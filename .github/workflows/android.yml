
name: Build ISMAR APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ISMAR project
        run: |
          unzip -q ISMAR-V1-extended.zip
          ls -la ISMAR

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project files
        working-directory: ISMAR
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Run unit tests
        working-directory: ISMAR
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ISMAR
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISMAR-debug-apk
          path: ISMAR/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
